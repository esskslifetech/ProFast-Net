name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native --config Release --parallel

      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: Known-answer vectors
        shell: bash
        run: |
          bin=./build/native/bin/pfbench
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" selftest | tee vectors.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert the derivation vector
        shell: bash
        run: |
          python - <<'PY'
          import json
          data = json.load(open("vectors.json"))
          assert data["address"] == "fd41:ae7d:9004:782d:a2d2:c2ca:7166:0e99", data["address"]
          assert data["port"] == 35239, data["port"]
          assert data["token"] == "AAAAAQAAAAAAAAPoAAECAwQFBgcICQoLDA0OD_xKMVWkDMvZK13nmJsm1YE"
          print("vectors ok")
          PY

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip psutil rich pytest ruff

      - name: Lint
        run: ruff check python/src python/tests

      - name: Test
        working-directory: python
        env:
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider

  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/profastd

      - name: Test
        run: go test ./...
