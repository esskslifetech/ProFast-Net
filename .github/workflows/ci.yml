name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native --config Release --parallel

      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: Known-answer vectors
        shell: bash
        run: |
          bin=./build/native/bin/pfbench
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" selftest | tee vectors.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert the derivation vector
        shell: bash
        run: |
          python - <<'PY'
          import json
          data = json.load(open("vectors.json"))
          mirage = data["mirage"]
          assert mirage["address"] == "fd41:ae7d:9004:782d:a2d2:c2ca:7166:0e99", mirage["address"]
          assert mirage["port"] == 35239, mirage["port"]
          assert data["spa"]["token"] == "AAAAAQAAAAAAAAPoAAECAwQFBgcICQoLDA0OD_xKMVWkDMvZK13nmJsm1YE", data["spa"]["token"]
          print("vectors ok")
          PY

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip psutil rich pytest ruff

      - name: Lint
        run: ruff check python/src python/tests

      - name: Test
        working-directory: python
        env:
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider

  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          # macOS 26 kills Go test binaries older than 1.23 (missing LC_UUID)
          # with "signal: abort trap"; 1.23 is the first toolchain that emits it.
          go-version: "1.23"

      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/profastd

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee go-test.log

      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          if [ -f go-test.log ]; then
            tail -n 30 go-test.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
